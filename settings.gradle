pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}
rootProject.name = "Casio GShock Smart Sync"
include ':app'

// Development switch for testing unreleased GShockAPI changes from a sibling checkout.
if (gradle.startParameter.projectProperties.containsKey('useLocalGShockApi')) {
    include ':api'
    project(':api').projectDir = file('../GShockAPI/api')
}
